<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — AturUang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-badge">💰</span> <strong>AturUang</strong></div>
      <div class="auth-subtitle">Buat akun baru, siapa saja boleh daftar 🎉</div>

      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

      <form method="POST">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" name="username" placeholder="3-20 karakter, huruf/angka/underscore" required autofocus>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Minimal 6 karakter" required>
        </div>
        <button class="btn full" type="submit">Daftar & Masuk</button>
      </form>

      <div class="auth-switch">Sudah punya akun? <a href="{{ url_for('login') }}">Masuk di sini</a></div>
    </div>
  </div>
</body>
</html>
